name: Build translate updater

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-updater.yml"
      - "dev/updater/**"
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish dev/updater/TranslateDbUpdater.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -o artifacts/translate-updater

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translate-updater-win-x64
          path: artifacts/translate-updater/translate-updater.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/translate-updater/translate-updater.exe
